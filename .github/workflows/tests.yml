name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install OpenSSL and OSRM runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssl libtbb12
          sudo apt-get install --yes libtbbmalloc2t64 || sudo apt-get install --yes libtbbmalloc2

      - name: Run unit tests
        run: npm run utest

      - name: Run integration tests
        run: npm run itest
